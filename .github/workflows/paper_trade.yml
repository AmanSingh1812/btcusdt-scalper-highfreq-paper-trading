name: Scalper Paper Trade (5m PDH/PDL, high-frequency)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scalper-highfreq-paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python paper_trade.py

      - name: Commit results
        run: |
          git config user.name "scalper-highfreq-paper-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ STATUS.md
          git diff --cached --quiet || git commit -m "Paper trade update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
